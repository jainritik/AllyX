<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f4f5}body{padding:8px}
    #panel{height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(9,9,11,.82);box-shadow:0 18px 55px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
    header{height:44px;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.1);-webkit-app-region:drag}.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}.title{font-size:12px;font-weight:800;letter-spacing:.16em}.state{font-size:10px;color:#a1a1aa}.actions{margin-left:auto;display:flex;gap:3px;-webkit-app-region:no-drag}button{border:0;border-radius:8px;background:transparent;color:#d4d4d8;padding:7px;cursor:pointer}button:hover{background:rgba(255,255,255,.1)}
    #notice{display:none;padding:6px 12px;border-bottom:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.1);font-size:10px;color:#a7f3d0}.session-controls{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.1);-webkit-app-region:no-drag}.session-controls button{padding:7px 11px;background:rgba(255,255,255,.09);font-size:11px;font-weight:700}.session-controls #listen.active{background:#059669;color:white}.session-controls #end{margin-left:auto;background:#b91c1c;color:white}.audio-note{font-size:9px;color:#a1a1aa}.question{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.1)}.label{margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:.12em;color:#34d399}.question .label{color:#71717a}.scroll{overflow:auto;white-space:pre-wrap}.question-text{max-height:54px;font-size:12px;line-height:1.45;color:#d4d4d8}.answer{min-height:0;flex:1;padding:12px 16px;display:flex;flex-direction:column}.answer-text{height:100%;padding-right:8px;font-size:15px;line-height:1.55}.answer-text p{margin:0 0 8px}.answer-text h3{margin:8px 0 5px;font-size:1em;color:#a7f3d0}.answer-text pre{margin:8px 0;padding:10px;border-radius:8px;background:rgba(0,0,0,.45);overflow:auto;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.answer-text li{margin-left:18px}.placeholder{color:#71717a}
    .manual{display:grid;grid-template-columns:1fr auto;gap:7px;padding:9px 12px;border-top:1px solid rgba(255,255,255,.1);-webkit-app-region:no-drag}.manual textarea{min-height:58px;max-height:110px;resize:vertical;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px;background:rgba(0,0,0,.28);color:#f4f4f5;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}.manual textarea:focus{border-color:#34d399}.manual-actions{display:flex;flex-direction:column;gap:5px}.primary{background:#059669;color:white;font-weight:700}.secondary{background:rgba(255,255,255,.09)}button:disabled{cursor:wait;opacity:.55}#continue{display:none;background:#d97706;color:white;font-weight:700}#manualStatus{grid-column:1/-1;min-height:12px;font-size:10px;color:#a7f3d0}#manualStatus[data-tone="error"]{color:#fca5a5}#manualStatus[data-tone="progress"]{color:#fde68a}
    footer{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:#a1a1aa;-webkit-app-region:no-drag}label{display:flex;align-items:center;gap:7px}label:last-child{margin-left:auto}input{width:76px;accent-color:#34d399}.compact .question,.compact footer,.compact .label,.compact .manual,.compact .audio-note{display:none}.compact .answer{padding-top:14px}
  </style>
</head>
<body>
  <section id="panel">
    <header><span class="dot"></span><strong class="title">AllyX OVERLAY</strong><span class="state" id="state">Interactive</span><div class="actions">
      <button id="through" title="Click-through mode; unlock with Command/Ctrl+Shift+O">⇩</button><button id="open" title="Open full application">↗</button><button id="compact" title="Compact or expand">−</button><button id="hide" title="Hide overlay">×</button>
    </div></header>
    <div id="notice">Clicks pass through. Press ⌘⇧O on Mac or Ctrl+Shift+O on Windows to interact.</div>
    <div class="session-controls"><button id="listen">Start listening</button><span class="audio-note" id="audioNote">Mic + meeting audio</span><button id="end">End interview</button></div>
    <div class="question"><div class="label">LIVE QUESTION</div><div id="question" class="question-text scroll placeholder">Listening for the next question…</div></div>
    <div class="answer"><div class="label">SUGGESTED ANSWER</div><div id="answer" class="answer-text scroll placeholder">The next generated answer will appear here automatically.</div></div>
    <div class="manual"><textarea id="manual" placeholder="Type a question or paste code…"></textarea><div class="manual-actions"><button class="primary" id="ask">Ask</button><button class="secondary" id="scan">Scan code</button><button id="continue">Continue</button></div><div id="manualStatus"></div></div>
    <footer><label>Opacity <input id="opacity" type="range" min="55" max="96" value="82"></label><label>Text <input id="font" type="range" min="12" max="20" value="15"></label></footer>
  </section>
  <script>
    const api=window.electronAPI,panel=document.querySelector('#panel'),state=document.querySelector('#state'),notice=document.querySelector('#notice'),question=document.querySelector('#question'),answer=document.querySelector('#answer'),manual=document.querySelector('#manual'),manualStatus=document.querySelector('#manualStatus'),askButton=document.querySelector('#ask'),continueButton=document.querySelector('#continue'),listenButton=document.querySelector('#listen'),endButton=document.querySelector('#end'),audioNote=document.querySelector('#audioNote');let compact=false,asking=false,askTimeout=null,ending=false;
    const setStatus=(message,tone='success')=>{manualStatus.textContent=message||'';manualStatus.dataset.tone=tone};
    const renderAnswer=text=>{answer.replaceChildren();if(!text){answer.textContent='The next generated answer will appear here automatically.';return}let inCode=false,code=[],list=null;const flushCode=()=>{if(!code.length)return;const pre=document.createElement('pre');pre.textContent=code.join('\n');answer.append(pre);code=[]};for(const raw of text.split('\n')){if(raw.trim().startsWith('```')){if(inCode)flushCode();inCode=!inCode;list=null;continue}if(inCode){code.push(raw);continue}if(/^\s*[-*]\s+/.test(raw)){if(!list){list=document.createElement('ul');answer.append(list)}const li=document.createElement('li');li.textContent=raw.replace(/^\s*[-*]\s+/,'');list.append(li);continue}list=null;if(!raw.trim())continue;const node=document.createElement(/^#{1,3}\s+/.test(raw)?'h3':'p');node.textContent=raw.replace(/^#{1,3}\s+/,'');answer.append(node)}flushCode()};
    const finishAsk=()=>{asking=false;askButton.disabled=false;if(askTimeout){clearTimeout(askTimeout);askTimeout=null}};
    const setInteractive=value=>{state.textContent=value?'Interactive':'Click-through';notice.style.display=value?'none':'block'};
    setInteractive(api.getOverlayState().interactive);
    api.onOverlayInteractionChange(setInteractive);
    api.onTranscript(text=>{question.textContent=text||'Listening for the next question…';question.classList.toggle('placeholder',!text)});
    api.onAnswer(text=>{renderAnswer(text);answer.classList.toggle('placeholder',!text);if(compact){compact=false;panel.classList.remove('compact');api.resizeOverlay(480,460)}});
    api.onOverlayCapturedText(text=>{manual.value=text;setStatus('Code captured. Generating answer…','progress')});
    api.onOverlayStatus(status=>{setStatus(status.message,status.tone);const canContinue=status.action==='continue';continueButton.style.display=canContinue?'block':'none';if(canContinue)continueButton.disabled=false;if(status.message==='Generating answer…')answer.scrollTop=0;if(status.tone==='success'||status.tone==='error')finishAsk();if(status.tone==='error'&&ending){ending=false;endButton.disabled=false;listenButton.disabled=false;endButton.textContent='End interview'}});
    api.onRecordingState(value=>{listenButton.classList.toggle('active',value.listening);listenButton.textContent=value.finalizing?'Finishing audio…':value.listening?'Stop listening':'Start listening';listenButton.disabled=value.finalizing;audioNote.textContent=value.meetingAudio?'Mic + meeting audio active':'Microphone active · enable Screen & System Audio permission for interviewer audio'});
    document.querySelector('#through').onclick=()=>api.setIgnoreMouseEvents(true,{forward:true});document.querySelector('#open').onclick=()=>api.showApp();document.querySelector('#hide').onclick=()=>api.hideOverlay();
    const ask=async()=>{const value=manual.value.trim();if(!value||asking)return;asking=true;askButton.disabled=true;setStatus('Sending question…','progress');askTimeout=setTimeout(()=>{finishAsk();setStatus('The answer timed out. Check your connection and press Ask to retry.','error')},70000);try{const result=await api.submitOverlayQuestion(value);if(result.success){setStatus('Generating answer…','progress');manual.value=''}else{finishAsk();setStatus(result.error||'Could not send the question.','error')}}catch(error){finishAsk();setStatus(error?.message||'Could not send the question.','error')}};
    askButton.onclick=ask;manual.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();ask()}};document.querySelector('#scan').onclick=async()=>{try{const result=await api.toggleScannerFrame();setStatus(result.error|| (result.active?'Position the frame and press Capture.':'Scanner closed.'),result.error?'error':'success')}catch(error){setStatus(error?.message||'Could not open the scanner.','error')}};
    continueButton.onclick=async()=>{continueButton.disabled=true;setStatus('Continuing answer…','progress');try{const result=await api.continueOverlayAnswer();if(!result.success){continueButton.disabled=false;setStatus(result.error||'Could not continue the answer.','error')}}catch(error){continueButton.disabled=false;setStatus(error?.message||'Could not continue the answer.','error')}};
    listenButton.onclick=async()=>{listenButton.disabled=true;setStatus('Updating audio…','progress');try{const result=await api.toggleOverlayListening();if(!result.success){listenButton.disabled=false;setStatus(result.error||'Could not update listening.','error')}}catch(error){listenButton.disabled=false;setStatus(error?.message||'Could not update listening.','error')}};
    endButton.onclick=async()=>{if(ending)return;ending=true;endButton.disabled=true;listenButton.disabled=true;endButton.textContent='Ending…';setStatus('Saving and closing this interview…','progress');try{const result=await api.endOverlayInterview();if(!result.success){ending=false;endButton.disabled=false;listenButton.disabled=false;endButton.textContent='End interview';setStatus(result.error||'Could not end the interview.','error')}}catch(error){ending=false;endButton.disabled=false;listenButton.disabled=false;endButton.textContent='End interview';setStatus(error?.message||'Could not end the interview.','error')}};
    document.querySelector('#compact').onclick=()=>{compact=!compact;panel.classList.toggle('compact',compact);api.resizeOverlay(compact?320:480,compact?220:460)};
    document.querySelector('#opacity').oninput=e=>panel.style.background=`rgba(9,9,11,${e.target.value/100})`;document.querySelector('#font').oninput=e=>answer.style.fontSize=`${e.target.value}px`;
  </script>
</body>
</html>
