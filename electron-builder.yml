appId: com.allyx.ai
productName: AllyX
copyright: Copyright (c) 2024 AllyX

directories:
  output: dist
  buildResources: electron/assets

files:
  - electron/**/*
  - public/favicon.ico
  - package.json
  - "!node_modules/**/*"

extraResources:
  - from: electron/assets/
    to: assets/
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/assets/icon.png
  artifactName: AllyX-${version}-Setup.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
  icon: electron/assets/icon.png
  artifactName: AllyX-${version}-${arch}.${ext}
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: AllyX uses the microphone for practice-session transcription.
    NSAudioCaptureUsageDescription: AllyX captures system audio only when you enable system-audio transcription.
    NSCameraUsageDescription: AllyX uses the camera only when you enable practice-session video.
    NSScreenCaptureUsageDescription: AllyX captures a selected practice area for OCR when you request it.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: electron/assets/icon.png
  category: Utility
